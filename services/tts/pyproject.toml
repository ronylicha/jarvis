[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-tts"
version = "0.1.0"
description = "Jarvis TTS service — Piper TTS wrapper with FastAPI"
requires-python = ">=3.12"
dependencies = [
 "fastapi>=0.115.0",
 "uvicorn[standard]>=0.32.0",
 "pydantic>=0.9.0",
 "pydantic-settings>=2.6.0",
 "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
 "httpx>=0.27.0",
 "pytest>=8.3.0",
 "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]